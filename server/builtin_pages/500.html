<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{code} — {title}</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      background: #1a1214;
      color: #f3e8e8;
    }
    main {
      text-align: center;
      padding: 2rem;
      max-width: 32rem;
    }
    .code { font-size: 4rem; font-weight: 700; color: #ff8a8a; margin: 0; }
    h1 { font-size: 1.25rem; font-weight: 500; margin: 0.5rem 0 1rem; }
    p { color: #c4a8a8; line-height: 1.5; margin: 0; }
    a { color: #ff8a8a; }
  </style>
</head>
<body>
  <main>
    <p class="code">{code}</p>
    <h1>{title}</h1>
    <p>{message}</p>
    <p style="margin-top:1.5rem"><a href="/">На главную</a></p>
  </main>
</body>
</html>
